services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rag_dev
      POSTGRES_USER: rag_dev
      POSTGRES_PASSWORD: change-me
    ports:
      - "5433:5432"
    volumes:
      - "postgres_data:/var/lib/postgresql/data"
      - "./postgres/init:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U rag_dev -d rag_dev
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --requirepass
      - change-me
    ports:
      - "6380:6379"
    volumes:
      - "redis_data:/data"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - -a
        - change-me
        - ping
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
